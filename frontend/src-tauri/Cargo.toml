[package]
name = "ds5forge"
version = "0.4.0-rc.10"
description = "DS5Forge wired DualSense companion shell"
authors = ["DS5Forge contributors"]
edition = "2021"

[lib]
name = "ds5forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol", "desktop-plugins"]
desktop-plugins = [
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-shell",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-updater",
]

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
