[package]
name = "ds5forge"
version = "0.1.0"
description = "DS5Forge wired DualSense companion shell"
authors = ["DS5Forge contributors"]
edition = "2021"

[lib]
name = "ds5forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
