name: DS5Forge checks

on:
  push:
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_versions.py

  linux-static-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_versions.py
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check source tests scripts
      - run: ruff check source tests scripts
      - run: mypy source/dualsense_companion
      - run: python -m compileall -q source scripts tests
      - run: pytest
      - run: python -m pip wheel . --no-deps --wheel-dir dist/p4-wheel

  windows-import-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m compileall -q source
      - run: python -m PyInstaller source/build.spec --distpath source/dist --workpath source/build_tmp --noconfirm
        env:
          DSC_CONSOLE: "1"
      - run: python scripts/smoke_packaged_core.py source/dist/DS5ForgeCore.exe

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -e . pyinstaller
      - run: python scripts/build_core.py
      - run: python scripts/smoke_packaged_core.py source/dist/DS5ForgeCore.exe
      - run: python scripts/prepare_sidecar.py
      - run: npm run tauri:build
        working-directory: frontend
      - run: >-
          python scripts/verify_windows_pe_subsystem.py
          frontend/src-tauri/target/release/ds5forge.exe
          source/dist/DS5ForgeCore.exe
      - run: cargo fmt --check
        working-directory: frontend/src-tauri
      - run: cargo check --all-targets --all-features
        working-directory: frontend/src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: frontend/src-tauri
