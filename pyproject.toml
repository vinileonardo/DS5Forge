[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ds5forge"
version = "0.4.0-rc.3"
description = "Wired DualSense companion with a local core authority"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydualsense>=0.7.5,<0.8; sys_platform == 'win32'",
  "PyAudioWPatch>=0.2.12.8,<0.3; sys_platform == 'win32'",
  "customtkinter; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
ds5forge = "dualsense_companion.app:main"

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]

[tool.setuptools.package-data]
dualsense_companion = ["resources/**/*.json", "resources/**/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["source"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["source", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "source"
check_untyped_defs = true
disallow_any_generics = false
warn_unused_ignores = false
exclude = '(^|/)(build|dist|\.venv)/'

[[tool.mypy.overrides]]
module = ["customtkinter"]
ignore_missing_imports = true
